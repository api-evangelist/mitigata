name: Mitigata
description: >-
  Mitigata is an India-based, IRDAI-licensed integrated cyber resilience platform that bundles cyber
  insurance, 24x7 security operations, and compliance under one accountable pod. It offers smart cyber
  liability, D&O, E&O, crime and EPLI insurance; an in-house Bengaluru SOC with MDR, EDR/XDR, SIEM,
  SASE, ZTNA and DFIR; automated compliance for ISO 27001, SOC 2, PCI DSS, DPDP, GDPR, HIPAA, RBI and
  SEBI-CSCRF; and Gordon AI, an autonomous AI SOC covering dark-web monitoring, attack-surface
  management, third-party risk and phishing simulation. Mitigata publishes eleven purpose-built APIs
  (cyber score, email security, asset discovery, phishing protect, dark-web scanner, security checklist,
  third-party risk, employee risk, attack assist, cyber insurance and claims) but gates technical
  onboarding behind a booked API walkthrough.
